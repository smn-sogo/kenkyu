<script>
(() => {
  const PLACEHOLDER_WORDS = ['表示サンプル', '【表示サンプル】', '近日公開予定', '近日公開', 'サンプル'];
  const root = document.getElementById('research-detail');
  if (!root) return;

  const protectDetail = () => {
    const text = (root.textContent || '').replace(/\s+/g, ' ');
    if (PLACEHOLDER_WORDS.some(word => text.includes(word))) {
      // Placeholder/demo research must never be presented as a research detail page.
      location.replace('research.html');
      return;
    }

    // Remove unavailable/coming-soon style controls if old data contains no published file.
    root.querySelectorAll('.report-unavailable,.worksheet-unavailable').forEach(el => {
      const t = (el.textContent || '').trim();
      if (/準備中|近日公開|サンプル/.test(t)) el.remove();
    });
  };

  const observer = new MutationObserver(protectDetail);
  observer.observe(root, { childList:true, subtree:true });
  protectDetail();
})();
</script>
